{% extends 'tracker/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4 text-center">
            <h3 class="text-danger mb-3">تأكيد الحذف ⚠️</h3>
            <p>هل أنت متأكد من رغبتك في حذف هذا العنصر؟</p>
            <p class="fw-bold fs-5">"{{ object.title }}"</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">نعم، احذف الأن</button>
                <a href="{% url 'library' %}" class="btn btn-secondary w-100">إلغاء</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
