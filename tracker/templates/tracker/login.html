{% extends 'tracker/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4">
            <h3 class="text-center mb-3">تسجيل الدخول</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-teal w-100 mt-2">دخول</button>
            </form>
            <p class="text-center mt-3">ليس لديك حساب؟ <a href="{% url 'register' %}">إنشاء حساب جديد</a></p>
        </div>
    </div>
</div>
{% endblock %}
